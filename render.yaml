services:
  - type: web
    name: district-trending
    runtime: node
    plan: free
    # Build the Vite frontend into dist/, then `npm start` runs server.js
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Render injects PORT automatically; server.js already reads process.env.PORT
    envVars:
      # Set these in the Render dashboard (Environment tab) after first deploy.
      # Optional in practice: cache.json has Infinity TTLs, so the app serves
      # frozen data with no live API calls — keys are only used on a cache miss.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
